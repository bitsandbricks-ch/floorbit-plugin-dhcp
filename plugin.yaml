# The event's DHCP server on the health wall: the server, and how full each subnet is. Off until
# turned on under Settings > Plugins. It only reads.
id: dhcp
name: DHCP (Kea)
icon: vlan
version: "1.1.0"
floorbit: ">=0.1,<2"
description: "The event's Kea DHCP server on the health wall: whether it answers (and its high-availability state), and for each subnet how many addresses are left. Counts only, never a lease's address, MAC or host name."
author: Floorbit
homepage: https://www.isc.org/kea/
uses: [settings, http, health]
settings:
  - {key: url, label: Kea API URL, type: url, placeholder: "http://192.0.2.53:8000",
     help: "The Kea Control Agent (or, from Kea 2.7, the DHCPv4 server's own HTTP control socket)."}
  - {key: control_agent, label: Through the Control Agent, type: bool, default: true,
     help: "On: the URL is the Control Agent, which passes commands to the DHCPv4 server. Off: the URL is the DHCPv4 server itself."}
  - {key: username, label: Username, type: string, help: "Only when the API asks for basic authentication."}
  - {key: password, label: Password, type: secret}
  - {key: pool_warn, label: Subnet warning (%), type: int, default: 80,
     help: "A subnet this full turns amber; at 95% it turns red."}
  - {key: verify_ssl, label: Verify TLS certificates, type: bool, default: true,
     help: "Only for an https URL. Turn it off only on a network you trust."}
